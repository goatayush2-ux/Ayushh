
name: Inspect GPT Launcher source

on:
  workflow_dispatch:
  push:
    paths:
      - 'MojoLauncher-3_openjdk.zip.zip'
      - '.github/workflows/gpt-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect actual Mojo source
        run: |
          set -euo pipefail
          unzip -t MojoLauncher-3_openjdk.zip.zip
          mkdir extracted
          unzip -q MojoLauncher-3_openjdk.zip.zip -d extracted

          echo "=== SOURCE FILES ==="
          find extracted -type f | sort > source-files.txt
          head -n 500 source-files.txt

          echo "=== RENDERER AND INPUT REFERENCES ==="
          grep -RniE 'GL4ES|ANGLE|Zink|mouseSensitivity|sensitivity|onGenericMotion|MotionEvent' extracted \
            --include='*.java' --include='*.kt' --include='*.cpp' \
            --include='*.h' --include='*.xml' \
            > inspection-report.txt || true

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Launcher-Source-Inspection
          path: |
            source-files.txt
            inspection-report.txt
            
