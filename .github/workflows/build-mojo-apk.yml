
name: Build GPT Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MojoLauncher-3_openjdk.zip.zip'
      - '.github/workflows/build-mojo-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mojo source
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q MojoLauncher-3_openjdk.zip.zip -d source

          SETTINGS_FILE="$(find source -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS_FILE"
          ROOT="$(dirname "$SETTINGS_FILE")"

          test -f "$ROOT/gradlew"
          test -f "$ROOT/.gitmodules"
          echo "MOJO_ROOT=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

  
      - name: Fetch native dependencies
        run: |
          set -euo pipefail
          cd "$MOJO_ROOT"

          git clone --depth 1 https://github.com/MojoLauncher/glfw glfw
          git clone --depth 1 https://github.com/MojoLauncher/mojoexec mojoexec
          git clone --depth 1 https://github.com/MojoLauncher/MojoSDL sdl
          git clone --depth 1 https://github.com/MojoLauncher/NoBlocklist NoBlocklist

          JNI_DIR="$MOJO_ROOT/app_mojo/src/main/jni"
          mkdir -p "$JNI_DIR"

          # Remove placeholder folders before creating links
          rm -rf "$JNI_DIR/glfw"
          rm -rf "$JNI_DIR/mojoexec"
          rm -rf "$JNI_DIR/sdl"

          ln -s "$MOJO_ROOT/glfw" "$JNI_DIR/glfw"
          ln -s "$MOJO_ROOT/mojoexec" "$JNI_DIR/mojoexec"
          ln -s "$MOJO_ROOT/sdl" "$JNI_DIR/sdl"

          # Verify all dependencies
          test -f "$JNI_DIR/glfw/CMakeLists.txt"
          test -f "$JNI_DIR/mojoexec/CMakeLists.txt"
          test -f "$JNI_DIR/sdl/CMakeLists.txt"
          

      - name: Prepare Git metadata
        run: |
          set -euo pipefail
          cd "$MOJO_ROOT"
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Prepare Android build"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build Android APK
        run: |
          set -euo pipefail
          cd "$MOJO_ROOT"
          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace \
            :app_mojo:assembleFullDebug

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk \
            "$GITHUB_WORKSPACE/out/GPT-Launcher.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Launcher-APK
          path: out/GPT-Launcher.apk
          if-no-files-found: error
          
